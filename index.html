<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobichat Support — Indonesia | Tickets-First</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1e64dc; --blue-dark:#1e4faf;
  --text:#1f2937; --text-weak:#6b7280; --text-muted:#9ca3af; --text-strong:#151c24;
  --border:#e5e7eb; --surface:#ffffff; --grey-100:#f3f4f6;
  /* Mobichat side-navigation design tokens (side-navigation.share.css) — the rail below
     is repainted with these so it matches the real app's nav component. */
  --sn-font: "Plus Jakarta Sans", "Inter", sans-serif;
  --sn-border: #e5e7eb; --sn-text-muted: #6b7280; --sn-hover: #f3f4f6;
  --sn-accent: #2563eb; --sn-badge: #dc2626;
  --error:#dc2626; --success:#16a34a; --warning:#d97706;
  --sky-bg:#eff8ff; --sky-border:#bfe2fe;
  --violet:#6d28d9;
  --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:12px; --r-2xl:16px; --r-pill:999px;
  --shadow: 0 1px 3px rgb(23 23 23 / .08);
  --shadow-lg: 0 10px 15px -3px rgb(23 23 23 / .10);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--text); background:var(--grey-100); font-size:14px; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer;}
input,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#d1d5db; border-radius:999px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- App shell: icon rail + flyout menu panel (side-navigation.share.css /
   side-navigation.structure.json) ---------- */
.app{display:flex; height:100vh; overflow:hidden;}
.sn-rail{
  width:76px; flex:0 0 76px; background:var(--surface); border-right:1px solid var(--sn-border);
  display:flex; flex-direction:column; align-items:center; min-height:0; font-family:var(--sn-font);
  padding:10px 6px;
}
.sn-rail-logo{
  width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  color:var(--sn-accent); margin-bottom:8px; flex:0 0 auto;
}
.sn-rail-logo svg{width:22px; height:22px;}
.sn-rail-scroll{display:flex; flex-direction:column; gap:6px; flex:1 1 auto; min-height:0; overflow-y:auto; width:100%;}
.sn-rail-footer{display:flex; flex-direction:column; align-items:center; gap:8px; padding-top:8px; flex:0 0 auto; width:100%;}
.sn-rail-btn{
  position:relative; width:64px; min-height:52px; margin-inline:auto; box-sizing:border-box; border:none;
  background:transparent; border-radius:10px; color:var(--sn-text-muted); display:flex; align-items:center;
  justify-content:center; flex-direction:column; gap:2px; padding:4px; font-size:10px; font-weight:500;
  line-height:1.3; text-align:center; transition:background-color .15s ease-out, color .15s ease-out;
}
.sn-rail-btn svg{width:20px; height:20px; flex:0 0 20px; display:block;}
.sn-rail-btn:not(.is-active):hover{background:var(--sn-hover); color:var(--sn-accent);}
.sn-rail-btn.is-active{background:var(--sn-active-bg); color:var(--sn-accent);}
.sn-rail-btn:focus-visible{outline:0; box-shadow:0 0 0 2px rgba(37,99,235,.25);}
.sn-rail-icon-wrap{position:relative; display:flex; align-items:center; justify-content:center; width:20px; height:20px; flex:0 0 20px;}
.sn-rail-util{
  border:none; background:transparent; width:36px; height:36px; border-radius:8px; display:flex;
  align-items:center; justify-content:center; color:var(--sn-text-muted); position:relative;
}
.sn-rail-util:hover{background:var(--sn-hover); color:var(--sn-accent);}
.sn-rail-util svg{width:19px; height:19px;}
.sn-avatar-btn{
  width:36px; height:36px; border-radius:999px; border:none; background:var(--sn-accent); color:#fff;
  font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; position:relative;
}
.sn-avatar-dot{
  position:absolute; bottom:-1px; right:-1px; width:10px; height:10px; border-radius:999px; background:#22c55e;
  border:2px solid var(--surface);
}
.sn-badge{
  position:absolute; top:-6px; right:-8px; background:var(--sn-badge); color:#fff; font-size:10px; font-weight:700;
  border-radius:999px; padding:0 5px; min-width:17px; height:17px; line-height:17px; text-align:center;
}
.sn-flyout{
  width:236px; flex:0 0 236px; border-right:1px solid var(--sn-border); background:var(--surface);
  padding:18px 14px; overflow-y:auto; font-family:var(--sn-font);
}
.sn-flyout-title{margin:0 0 14px; padding:0 6px; font-size:19px; font-weight:700; color:var(--text-strong);}
.sn-menu-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
.sn-menu-row{
  width:100%; border:0; border-left:3px solid transparent; background:transparent; border-radius:8px;
  min-height:38px; padding:8px 10px; font-size:13px; font-weight:600; display:flex; align-items:center;
  gap:9px; text-align:left; color:var(--text); cursor:pointer;
}
.sn-menu-row svg{width:18px; height:18px; flex:0 0 18px; color:var(--sn-text-muted);}
.sn-menu-row:hover{background:var(--sn-hover);}
.sn-menu-row.is-active{background:var(--sn-active-bg); color:var(--sn-accent); border-left-color:var(--sn-accent);}
.sn-menu-row.is-active svg{color:var(--sn-accent);}
.sn-badge-inline{
  margin-left:auto; background:var(--sn-badge); color:#fff; font-size:10.5px; font-weight:700;
  border-radius:999px; padding:1px 7px; flex:0 0 auto;
}

.view-area{flex:1; min-width:0; display:flex; overflow:hidden;}
.view{flex:1; min-width:0; display:flex; overflow:hidden;}
.view[hidden]{display:none;}

/* ---------- Conversation list (Inbox) ---------- */
.convlist{
  width:320px; flex:0 0 320px; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0;
}
.convlist-top{padding:14px 14px 10px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:10px;}
.convlist-title{font-size:16px; font-weight:700; color:var(--text-strong); display:flex; align-items:center; justify-content:space-between;}
.conv-tabs{display:flex; gap:2px; padding:0 10px; border-bottom:1px solid var(--border); overflow-x:auto;}
.conv-tab{
  border:none; border-bottom:2px solid transparent; background:transparent; padding:8px 10px; font-size:12.5px;
  font-weight:500; color:var(--text-weak); white-space:nowrap; border-radius:var(--r-sm) var(--r-sm) 0 0;
  transition:background-color .12s ease-out;
}
.conv-tab:hover{background:var(--grey-100);}
.conv-tab.active{color:var(--blue); border-bottom-color:var(--blue); background:var(--sky-bg); font-weight:600;}
.new-banner{
  margin:8px 10px 0; background:var(--sky-bg); border:1px solid var(--sky-border); color:var(--blue-dark);
  border-radius:var(--r-md); padding:8px 10px; font-size:12.5px; font-weight:600; display:flex; align-items:center;
  justify-content:space-between; gap:8px; cursor:pointer;
}
.conv-scroll{flex:1; min-height:0; overflow-y:auto;}
/* Card layout matches the real Mobichat InboxView: an overlaid left status stripe
   (2px default, 8px selected), avatar + name/time, read-receipt + snippet, and a
   bottom row of a phone chip (left) and status chips (right). */
.conv-row{
  position:relative; display:flex; width:100%; overflow:hidden; cursor:pointer;
  border-bottom:1px solid #efefef; text-align:left; transition:background-color .12s ease-out;
}
.conv-row:hover{background:#f9fafb;}
.conv-row.served-bg{background:var(--grey-100);}
.conv-row.served-bg:hover{background:#e5e7eb;}
.conv-row.selected{box-shadow:var(--shadow-lg);}
.conv-stripe{position:absolute; inset:0 auto 0 0; z-index:0;}
.conv-row-inner{position:relative; z-index:1; display:flex; min-width:0; flex:1; gap:12px; padding:12px 16px;}
.conv-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;}
.conv-row-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.conv-name{font-weight:600; font-size:13px; color:var(--text-strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.conv-time{font-size:10px; font-weight:500; color:var(--text-weak); flex:0 0 auto;}
.conv-preview-row{display:flex; align-items:flex-start; gap:4px;}
.conv-readreceipt{width:15px; height:15px; flex:0 0 15px; margin-top:1px;}
.conv-preview{
  font-size:12px; color:var(--text-weak); min-width:0; flex:1;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.conv-bottom-row{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.conv-phone-chip{
  border:1px solid var(--border); background:var(--surface); border-radius:var(--r-sm); padding:2px 8px;
  font-size:11px; font-weight:500; color:var(--text); box-shadow:var(--shadow); white-space:nowrap;
}
.conv-chips{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
.conv-chip{border-radius:var(--r-sm); font-size:11px; font-weight:500; padding:2px 8px; border:1px solid; box-shadow:var(--shadow); white-space:nowrap;}
.conv-chip-neutral{border-color:var(--border); background:var(--surface); color:var(--text);}
.conv-chip-success{border-color:#4ade80; background:#dcfce7; color:#15803d;}
.conv-chip-warning{border-color:#fbbf24; background:#fffbeb; color:#b45309;}
.conv-chip-brand{border-color:#60b5fa; background:var(--sky-bg); color:var(--blue-dark);}
.lock-ico{font-size:11px;}
.unread-dot{
  background:var(--blue); color:#fff; font-size:10px; font-weight:700; border-radius:999px; min-width:16px;
  height:16px; display:flex; align-items:center; justify-content:center; padding:0 4px;
}

/* ---------- Shared bits (search box, simulate button, new-ticket banner, pills, avatar) ---------- */
.search-box{
  display:flex; align-items:center; gap:6px; background:var(--grey-100); border:1px solid var(--border);
  border-radius:var(--r-md); padding:7px 10px;
}
.search-box input{border:none; background:transparent; outline:none; font-size:13px; width:100%; color:var(--text);}
.btn-simulate{
  border:1px dashed var(--blue); background:#f3f7ff; color:var(--blue); border-radius:var(--r-md);
  padding:8px 14px; font-size:12.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px;
}
.btn-simulate:hover{background:#e7f0ff;}
.sev-icon{
  display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
  border-radius:var(--r-sm); margin-right:6px; vertical-align:middle; flex:0 0 20px;
}
.avatar{
  width:36px; height:36px; border-radius:999px; flex:0 0 36px; display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size:13px;
}
.pill{border-radius:var(--r-pill); font-size:10px; font-weight:700; padding:2px 7px; letter-spacing:.02em;}
.pill-new{background:var(--blue); color:#fff;}
.pill-ai{background:#f3e8ff; color:var(--violet);}
.pill-you{background:#dbeafe; color:var(--blue-dark);}
.pill-mate{background:var(--grey-100); color:var(--text-weak); border:1px solid var(--border);}

/* ---------- Chat panel ---------- */
.chatpanel{flex:1; min-width:0; display:flex; flex-direction:column; background:#fafbfc; min-height:0;}
.chat-empty{flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:14px; flex-direction:column; gap:8px;}
.chat-back-bar{flex:0 0 auto; background:var(--grey-100); border-bottom:1px solid var(--border); padding:8px 18px;}
.chat-back-btn{border:none; background:transparent; color:var(--blue); font-size:12.5px; font-weight:700; padding:2px 0; cursor:pointer;}
.chat-back-btn:hover{color:var(--blue-dark); text-decoration:underline;}
.chat-header{
  background:var(--surface); border-bottom:1px solid var(--border); padding:12px 18px; display:flex;
  align-items:center; justify-content:space-between; gap:10px; flex:0 0 auto;
}
.chat-header-left{display:flex; align-items:center; gap:10px; min-width:0;}
.chat-header-name{font-weight:700; font-size:14.5px; color:var(--text-strong);}
.chat-header-sub{font-size:11.5px; color:var(--text-weak); display:flex; gap:8px; align-items:center; margin-top:2px; flex-wrap:wrap;}
.chat-header-right{display:flex; align-items:center; gap:8px; flex:0 0 auto;}
.badge-sentiment{border-radius:var(--r-pill); padding:3px 9px; font-size:11px; font-weight:700;}
.sent-Angry{background:#fee2e2; color:var(--error);}
.sent-Negative{background:#fff1e0; color:var(--warning);}
.sent-Neutral{background:var(--grey-100); color:var(--text-weak);}
.sent-Positive{background:#dcfce7; color:var(--success);}
.btn{
  border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:var(--r-md);
  padding:7px 12px; font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{background:var(--grey-100);}
.btn-primary{background:var(--blue); border-color:var(--blue); color:#fff;}
.btn-primary:hover{background:var(--blue-dark);}
.btn-violet{background:#f3e8ff; border-color:#e3d0fd; color:var(--violet);}
.btn-violet:hover{background:#ecdbfe;}
.btn-quick-send{background:#f0fdf4; border-color:#bbf7d0; color:var(--success);}
.btn-quick-send:hover{background:#dcfce7;}
.btn-sm{padding:5px 9px; font-size:11.5px;}
.chat-banner{
  padding:9px 18px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:8px; flex:0 0 auto;
  border-bottom:1px solid var(--border);
}
.banner-bot{background:var(--sky-bg); color:var(--blue-dark); border-bottom-color:var(--sky-border);}
.banner-lock-you{background:#f0fdf4; color:var(--success);}
.banner-lock-mate{background:#fff7ed; color:var(--warning);}

.thread{flex:1; min-height:0; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:10px;}
.day-divider{align-self:center; font-size:11px; color:var(--text-muted); background:var(--grey-100); padding:3px 10px; border-radius:999px; margin:6px 0;}
.msg-row{display:flex; flex-direction:column; max-width:66%;}
.msg-row.in{align-self:flex-start; align-items:flex-start;}
.msg-row.out{align-self:flex-end; align-items:flex-end;}
.msg-row.sys{align-self:center; max-width:80%; align-items:center;}
.bubble{border-radius:var(--r-lg); padding:9px 12px; font-size:13.5px; line-height:1.45; white-space:pre-line;}
.msg-row.in .bubble{background:var(--surface); border:1px solid var(--border); color:var(--text); border-bottom-left-radius:3px;}
.msg-row.out .bubble{background:var(--blue); color:#fff; border-bottom-right-radius:3px;}
.msg-row.out .bubble.ai{background:var(--sky-bg); color:var(--text-strong); border:1px solid var(--sky-border);}
.msg-row.sys .bubble{background:var(--grey-100); color:var(--text-weak); font-size:12px; text-align:center;}
.msg-translate{
  margin-top:4px; font-size:11.5px; color:var(--text-muted); background:var(--grey-100); border-radius:var(--r-sm);
  padding:5px 8px; display:flex; gap:5px; max-width:100%;
}
.msg-row.out .msg-translate{background:#eef4ff; color:var(--blue-dark);}
.msg-meta{font-size:10.5px; color:var(--text-muted); margin-top:3px; display:flex; gap:6px; align-items:center;}
.msg-label-ai{color:var(--violet); font-weight:700;}
.csat-stars{font-size:15px; letter-spacing:2px;}
.csat-survey-card{background:var(--sky-bg); border:1px solid var(--sky-border); border-radius:var(--r-lg); padding:12px 14px; max-width:260px;}
.csat-survey-title{font-weight:700; font-size:13px; color:var(--text-strong); margin-bottom:3px;}
.csat-survey-sub{font-size:11.5px; color:var(--text-weak); line-height:1.4; margin-bottom:8px;}
.csat-survey-stars{font-size:18px; letter-spacing:6px; color:var(--warning);}

.composer-wrap{flex:0 0 auto; border-top:1px solid var(--border); background:var(--surface); position:relative;}
.ai-popup{
  margin:10px 14px 0; background:linear-gradient(180deg,#f7fbff,#ffffff); border:1px solid var(--sky-border);
  border-radius:var(--r-xl); box-shadow:var(--shadow-lg); padding:12px 14px;
}
.ai-popup-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
.ai-popup-title{font-size:12.5px; font-weight:800; color:var(--blue-dark); display:flex; align-items:center; gap:6px;}
.ai-popup-close{border:none; background:transparent; color:var(--text-muted); font-size:14px; padding:2px 6px; border-radius:6px;}
.ai-popup-close:hover{background:var(--grey-100);}
.ai-meta-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
.chip{border-radius:var(--r-pill); font-size:10.5px; font-weight:700; padding:3px 8px; display:inline-flex; align-items:center; gap:4px;}
.chip-conf-hi{background:#dcfce7; color:var(--success);}
.chip-conf-lo{background:#fef2f2; color:var(--error);}
.chip-lang{background:var(--sky-bg); color:var(--blue-dark); border:1px solid var(--sky-border);}
.chip-flag{background:#fff7ed; color:var(--warning);}
.chip-kb{background:#f3e8ff; color:var(--violet); border:1px solid #e3d0fd;}
.ai-suggestion-text{font-size:13.5px; line-height:1.5; color:var(--text-strong); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:10px 12px; white-space:pre-line;}
.ai-popup-actions{display:flex; gap:8px; margin-top:10px;}
.composer{padding:12px 14px; display:flex; flex-direction:column; gap:8px;}
.composer-box{border:1px solid var(--border); border-radius:var(--r-lg); padding:8px 10px; display:flex; flex-direction:column; gap:6px;}
.composer-box textarea{border:none; outline:none; resize:none; font-size:13.5px; min-height:40px; max-height:100px; color:var(--text);}
.composer-toolbar{display:flex; align-items:center; justify-content:space-between;}
.composer-icons{display:flex; gap:10px; color:var(--text-muted); font-size:15px;}
.char-count{font-size:11px; color:var(--text-muted);}
.composer-actions{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.resolved-note{padding:14px; text-align:center; font-size:12.5px; color:var(--text-weak); background:var(--grey-100); margin:0 14px 14px; border-radius:var(--r-md);}
.hint-row{font-size:11px; color:var(--text-muted); padding:0 2px;}

/* ---------- Info panel ---------- */
.infopanel{width:340px; flex:0 0 340px; background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; min-height:0;}
.info-tabs{display:flex; border-bottom:1px solid var(--border); flex:0 0 auto;}
.info-tab{flex:1; border:none; background:transparent; padding:11px 0; font-size:12.5px; font-weight:700; color:var(--text-weak); border-bottom:2px solid transparent;}
.info-tab.active{color:var(--blue); border-color:var(--blue);}
.info-body{flex:1; min-height:0; overflow-y:auto; padding:14px;}
.info-card{border:1px solid var(--border); border-radius:var(--r-lg); padding:12px; margin-bottom:12px;}
.info-card-title{font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;}
.kv-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px;}
.kv-item{display:flex; flex-direction:column; gap:1px;}
.kv-label{font-size:10.5px; color:var(--text-muted);}
.kv-value{font-size:12.5px; font-weight:600; color:var(--text-strong);}
.agent-row{display:flex; align-items:center; gap:8px;}
.agent-row .agent-name{font-size:12.5px; font-weight:700; color:var(--text-strong);}
.agent-row .agent-role{font-size:10.5px; color:var(--text-muted);}
.reassign-row{margin-top:10px;}
.reassign-select{
  width:100%; border:1px solid var(--border); background:var(--surface); border-radius:var(--r-md);
  padding:7px 8px; font-size:12px; font-weight:600; color:var(--text); outline:none;
}
.reassign-select:focus{outline:2px solid var(--sky-border);}
.tag-row{display:flex; flex-wrap:wrap; gap:6px;}
.integration-row{display:flex; gap:8px;}
.integration-badge{flex:1; border:1px solid var(--border); border-radius:var(--r-md); padding:8px 6px; text-align:center; font-size:10.5px; font-weight:700; color:var(--text-weak);}
.integration-badge .dot{width:6px; height:6px; border-radius:999px; background:var(--success); display:inline-block; margin-right:4px;}
.media-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;}
.media-box{aspect-ratio:1; background:var(--grey-100); border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:16px;}
.notes-area{width:100%; border:1px solid var(--border); border-radius:var(--r-md); padding:8px; font-size:12.5px; resize:vertical; min-height:60px; outline:none;}
.empty-note{font-size:12px; color:var(--text-muted); text-align:center; padding:14px 4px;}
.log-item{display:flex; gap:8px; font-size:12px; color:var(--text-weak); padding:6px 0; border-bottom:1px solid var(--border);}
.log-item:last-child{border-bottom:none;}
.log-time{color:var(--text-muted); font-size:10.5px; flex:0 0 44px;}
.task-mini{border:1px solid var(--border); border-radius:var(--r-md); padding:10px; font-size:12px;}
.task-mini .tm-id{font-weight:800; color:var(--blue-dark); font-size:11.5px;}

/* ---------- Setup guide (customer-facing onboarding checklist) ---------- */
.setup-banner{
  background:linear-gradient(135deg,#eff8ff,#f3e8ff); border:1px solid var(--sky-border); border-radius:var(--r-xl);
  padding:18px 20px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.setup-banner-title{font-size:15px; font-weight:700; color:var(--text-strong); margin-bottom:3px;}
.setup-banner-sub{font-size:12.5px; color:var(--text-weak); max-width:520px; line-height:1.5;}
.setup-progress-wrap{flex:0 0 220px; min-width:180px;}
.setup-progress-label{font-size:11px; font-weight:700; color:var(--text-weak); margin-bottom:6px; display:flex; justify-content:space-between;}
.setup-progress-track{background:#ffffffaa; border:1px solid var(--sky-border); border-radius:var(--r-pill); height:10px; overflow:hidden;}
.setup-progress-fill{background:var(--blue); height:100%; border-radius:var(--r-pill); transition:width .25s ease-out;}
.setup-live-banner{
  background:#f0fdf4; border:1px solid #bbf7d0; color:var(--success); border-radius:var(--r-xl); padding:14px 18px;
  margin:18px 0; font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px;
}
.setup-locked-note{
  background:var(--grey-100); border:1px solid var(--border); color:var(--text-weak); border-radius:var(--r-xl); padding:12px 18px;
  margin:18px 0; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:10px;
}
.setup-section-label{
  font-size:12px; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;
  margin:0 0 10px; display:flex; align-items:center; gap:8px;
}
.setup-section-count{
  background:var(--grey-100); color:var(--text-weak); border-radius:var(--r-pill); padding:1px 8px; font-size:10.5px;
  text-transform:none; letter-spacing:0;
}
.setup-steps{display:flex; flex-direction:column; margin-bottom:22px;}
.setup-steps:last-of-type{margin-bottom:0;}
.setup-step{display:flex; gap:14px; position:relative; padding-bottom:22px;}
.setup-step:last-child{padding-bottom:0;}
.setup-step-rail{display:flex; flex-direction:column; align-items:center; flex:0 0 auto;}
.setup-step-line{width:2px; flex:1; background:var(--border); margin-top:2px;}
.setup-step.done .setup-step-line{background:var(--success);}
.setup-checkbox{
  width:26px; height:26px; border-radius:999px; border:2px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; flex:0 0 26px; cursor:pointer; font-size:13px;
  font-weight:800; color:transparent; transition:background-color .15s, border-color .15s, color .15s;
}
.setup-checkbox:hover{border-color:var(--blue);}
.setup-step.done .setup-checkbox{background:var(--success); border-color:var(--success); color:#fff;}
.setup-step-card{
  flex:1; min-width:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:14px 16px; box-shadow:var(--shadow);
}
.setup-step.done .setup-step-card{background:#f9fffb; border-color:#bbf7d0;}
.setup-step-header{
  display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; border:none; background:transparent;
  padding:0; margin-bottom:4px; text-align:left; cursor:pointer;
}
.setup-chevron{color:var(--text-muted); font-size:12px; flex:0 0 auto;}
.setup-step-title{font-size:13.5px; font-weight:700; color:var(--text-strong);}
.setup-step.done .setup-step-title{color:var(--success);}
.setup-step-num{font-size:10.5px; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;}
.setup-step-desc{font-size:12.5px; color:var(--text-weak); line-height:1.5; margin-bottom:10px;}
.setup-step-hint{font-size:11px; color:var(--text-muted); margin-top:10px;}
.setup-panel{background:var(--grey-100); border:1px solid var(--border); border-radius:var(--r-md); padding:12px 14px; margin-bottom:2px;}
.setup-field-label{font-size:11.5px; font-weight:700; color:var(--text-weak); display:block; margin-bottom:6px;}
.setup-field-row{display:flex; gap:8px; flex-wrap:wrap;}
.setup-input, .setup-select{
  border:1px solid var(--border); border-radius:var(--r-md); padding:7px 10px; font-size:12.5px; color:var(--text);
  background:var(--surface); flex:1; min-width:160px;
}
.setup-input:focus, .setup-select:focus{outline:2px solid var(--sky-border);}
.setup-panel-note{font-size:11.5px; color:var(--text-muted); margin-top:8px;}
.setup-connected-row{font-size:12.5px; color:var(--text-strong); display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.setup-invite-list{display:flex; flex-direction:column; gap:6px; margin-top:10px;}
.setup-invite-chip{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:5px 8px; font-size:12px; color:var(--text-strong);
}
.setup-invite-chip span:first-of-type{flex:1;}
.setup-chip-remove{border:none; background:transparent; color:var(--text-muted); font-size:11px; padding:2px 4px; border-radius:4px; cursor:pointer;}
.setup-chip-remove:hover{background:var(--grey-100); color:var(--error);}
.setup-checkbox-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px;}
.setup-check-item{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text); cursor:pointer;}
.setup-check-item input{accent-color:var(--blue); width:15px; height:15px; cursor:pointer;}
.setup-toggle-row{display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:12.5px; font-weight:600; color:var(--text-strong); cursor:pointer;}
.setup-toggle{width:38px; height:22px; border-radius:999px; background:var(--border); flex:0 0 38px; position:relative; transition:background-color .15s;}
.setup-toggle.on{background:var(--success);}
.setup-toggle-knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:999px; background:#fff; box-shadow:var(--shadow); transition:left .15s;}
.setup-toggle.on .setup-toggle-knob{left:18px;}
.setup-upload-zone{
  border:2px dashed var(--border); border-radius:var(--r-md); background:var(--surface); padding:16px; text-align:center;
  font-size:12.5px; color:var(--text-weak); cursor:pointer; transition:border-color .12s, background-color .12s;
}
.setup-upload-zone:hover, .setup-upload-zone.drag-over{border-color:var(--blue); background:var(--sky-bg);}
.setup-upload-browse{color:var(--blue); font-weight:700;}
.setup-kb-list{display:flex; flex-direction:column; gap:6px; margin-top:12px;}
.setup-kb-item{
  display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:7px 9px;
}
.setup-kb-icon{font-size:16px; flex:0 0 auto;}
.setup-kb-meta{flex:1; min-width:0;}
.setup-kb-name{font-size:12.5px; font-weight:600; color:var(--text-strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.setup-kb-sub{font-size:11px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* ---------- Tickets page ---------- */
.page-outer{flex:1; min-width:0; display:flex; flex-direction:column; min-height:0;}
.page-header{
  flex:0 0 auto; display:flex; flex-direction:column; justify-content:center; gap:2px; min-height:56px;
  padding:10px 24px; border-bottom:1px solid var(--border); background:var(--surface);
}
.page{flex:1; min-width:0; overflow-y:auto; padding:20px 24px; min-height:0;}
.page-title{font-size:18px; line-height:28px; font-weight:600; color:var(--text-strong);}
.page-sub{font-size:13px; color:var(--text-weak); margin-top:1px;}
.page-header-flex{display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%;}
.search-box-table{background:var(--surface); border-radius:var(--r-md); padding:9px 14px; gap:8px;}
.search-box-table input{font-size:13.5px;}
.filter-btn-wrap{position:relative; flex:0 0 auto;}
.filters-trigger{
  display:flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--surface);
  border-radius:var(--r-md); padding:9px 12px; font-size:13px; color:var(--text-weak); white-space:nowrap; cursor:pointer;
}
.filters-trigger:hover{background:var(--grey-100);}
.filters-trigger.active{border-color:var(--blue); color:var(--blue-dark); background:var(--sky-bg);}
.filters-trigger-value{font-weight:700; color:var(--text-strong);}
.filters-trigger.active .filters-trigger-value{color:var(--blue-dark);}
.clear-filters-link{border:none; background:transparent; color:var(--blue); font-size:13px; font-weight:600; white-space:nowrap; padding:0; cursor:pointer;}
.clear-filters-link:hover{color:var(--blue-dark); text-decoration:underline;}
.clear-filters-link:disabled{color:var(--text-muted); cursor:default; text-decoration:none;}
.filter-panel{
  position:absolute; top:calc(100% + 8px); right:0; width:260px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-lg); box-shadow:var(--shadow-lg); padding:14px; z-index:50;
}
.filter-panel-section{margin-bottom:12px;}
.filter-panel-section:last-of-type{margin-bottom:0;}
.filter-panel-label{font-size:10.5px; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:7px;}
.filter-panel-options{display:flex; flex-direction:column; gap:6px;}
.filter-check{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text); cursor:pointer;}
.filter-check input{margin:0; cursor:pointer;}
.filter-panel-actions{display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--border);}
.page-tabs{display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--border);}
.page-tab{
  border:none; background:transparent; padding:9px 4px; margin-right:20px; font-size:13px; font-weight:600;
  color:var(--text-weak); border-bottom:2px solid transparent; display:flex; align-items:center; gap:7px;
}
.page-tab:hover{color:var(--text-strong);}
.page-tab.active{color:var(--blue); border-bottom-color:var(--blue);}
.page-tab-count{background:var(--grey-100); color:var(--text-weak); border-radius:var(--r-pill); padding:1px 8px; font-size:11px; font-weight:700;}
.page-tab.active .page-tab-count{background:var(--sky-bg); color:var(--blue-dark);}
.kpi-strip{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:16px;}
.kpi-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:12px 14px; box-shadow:var(--shadow);}
.kpi-label{font-size:10.5px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
.kpi-value{font-size:21px; font-weight:800; color:var(--text-strong); margin-top:4px;}
.kpi-value.blue{color:var(--blue);}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; align-items:stretch;}
.stat-grid.full{grid-template-columns:1fr;}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:16px 18px;}
.stat-card-title{font-size:13.5px; font-weight:700; color:var(--text-strong);}
.stat-card-sub{font-size:11.5px; color:var(--text-muted); margin-top:1px; margin-bottom:14px;}
.stat-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.stat-bar-row:last-child{margin-bottom:0;}
.stat-bar-label{width:128px; flex-shrink:0; font-size:12.5px; color:var(--text-weak); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.stat-bar-track{flex:1; height:8px; background:var(--grey-100); border-radius:var(--r-pill); overflow:hidden;}
.stat-bar-fill{height:100%; border-radius:var(--r-pill);}
.stat-bar-count{width:80px; flex-shrink:0; text-align:right; font-size:12px; font-weight:700; color:var(--text-strong);}
.stat-bar-count span{color:var(--text-muted); font-weight:600;}
.compare-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.compare-card{border:1px solid var(--border); border-radius:var(--r-md); padding:14px; text-align:center;}
.compare-card-icon{font-size:20px;}
.compare-card-value{font-size:20px; font-weight:800; color:var(--text-strong); margin-top:6px;}
.compare-card-label{font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin-top:2px;}
.reports-toggle-row{display:flex; justify-content:flex-end; margin-bottom:10px;}
.ticket-search-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
.filter-chips{display:flex; gap:7px; margin-bottom:14px; flex-wrap:wrap;}
.filter-chip{border:1px solid var(--border); background:var(--surface); border-radius:var(--r-pill); padding:6px 13px; font-size:12px; font-weight:600; color:var(--text-weak);}
.filter-chip.active{background:var(--blue); border-color:var(--blue); color:#fff;}
.ticket-table{width:100%; border-collapse:collapse; background:var(--surface); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow);}
.ticket-table th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); padding:10px 12px; border-bottom:1px solid var(--border); background:var(--grey-100);}
.ticket-table td{padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:middle; font-size:12.5px;}
.ticket-table tr:last-child td{border-bottom:none;}
.ticket-table tr:hover td{background:#fafbfc;}
.tt-customer{display:flex; align-items:center; gap:8px;}
.tt-customer-meta{display:flex; flex-direction:column; gap:1px;}
.tt-customer-name{font-weight:700; font-size:12.5px; color:var(--text-strong);}
.tt-customer-sub{font-size:10.5px; color:var(--text-muted);}
.status-pill{border-radius:var(--r-pill); padding:3px 9px; font-size:10.5px; font-weight:700; display:inline-block;}
.status-Unserved{background:#fff7ed; color:var(--warning);}
.status-Served{background:#eff8ff; color:var(--blue-dark);}
.status-Resolved{background:#dcfce7; color:var(--success);}
.status-Bot{background:#f3e8ff; color:var(--violet);}
.csat-mini{font-size:10px; font-weight:700; color:var(--warning); margin-top:3px; display:block;}

/* ---------- Tasks page (Kanban) ---------- */
.kanban-board{display:flex; align-items:flex-start; gap:8px; min-height:0; overflow-x:auto; overflow-y:visible; padding-bottom:8px;}
.kanban-col{
  display:flex; flex-direction:column; width:280px; flex:0 0 280px; background:#f3f4f6; border-radius:0 0 var(--r-xl) var(--r-xl);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8); border:1px solid var(--border);
}
.kanban-col-header{background:var(--surface); border-bottom:1px solid var(--border); border-radius:0;}
.kanban-col-accent{height:4px; width:100%; border-radius:0;}
.kanban-col-title-row{display:flex; align-items:center; gap:8px; padding:10px 12px 9px;}
.kanban-col-title{font-size:13px; font-weight:600; color:var(--text-strong);}
.kanban-col-count{
  border-radius:var(--r-pill); font-size:11px; font-weight:700; padding:1px 8px; background:var(--grey-100); color:var(--text-weak);
}
.kanban-col-body{
  display:flex; flex-direction:column; gap:10px; padding:10px; min-height:80px; flex:1; transition:background-color .12s ease-out;
}
.kanban-col-body.drag-over{background:rgba(30,100,220,.08); outline:2px dashed var(--blue); outline-offset:-4px; border-radius:var(--r-md);}
.kanban-task-card{
  background:var(--surface); border:1px solid var(--border); border-left-width:3px; border-radius:var(--r-xs);
  box-shadow:0 1px 2px rgba(15,23,42,.06); padding:10px 12px; cursor:grab; transition:box-shadow .12s ease-out, border-color .12s ease-out;
}
.kanban-task-card:hover{border-color:var(--grey-300, #d1d5db); box-shadow:var(--shadow-lg, var(--shadow));}
.kanban-task-card.dragging{opacity:.4;}
.kanban-task-card.Critical{border-left-color:var(--error);}
.kanban-task-card.Medium{border-left-color:var(--warning);}
.kanban-task-card.Low{border-left-color:var(--success);}
.kanban-card-top{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:6px;}
.task-id{font-size:11px; font-weight:800; color:var(--blue-dark); text-transform:uppercase; letter-spacing:.02em;}
.task-title{font-size:13.5px; font-weight:600; color:var(--text-strong); line-height:1.35; margin-bottom:6px;}
.task-team{font-size:10.5px; color:var(--text-muted); margin-bottom:8px;}
.task-field-lines{display:flex; flex-direction:column; gap:2px; font-size:11.5px; color:var(--text-default, #1f2937); margin-bottom:8px;}
.task-field-lines .fl-label{font-weight:600; color:var(--text-weak);}
.task-footer{display:flex; align-items:center; justify-content:flex-end; padding-top:8px; border-top:1px solid var(--border);}
.link-btn{border:none; background:transparent; color:var(--blue); font-size:12px; font-weight:700; padding:0; cursor:pointer;}
.kanban-empty-hint{font-size:11.5px; color:var(--text-muted); text-align:center; padding:10px 4px; border:1px dashed var(--border); border-radius:var(--r-md);}
.task-engineer-btn{border:none; background:transparent; padding:0; border-radius:999px; cursor:pointer; line-height:0; transition:box-shadow .12s ease-out;}
.task-engineer-btn:hover{box-shadow:0 0 0 2px var(--sky-border);}

/* ---------- Ticket modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(21,28,36,.5); display:flex; align-items:center; justify-content:center;
  z-index:200; padding:24px;
}
.modal-card{
  background:var(--surface); border-radius:var(--r-xl); box-shadow:var(--shadow-lg); width:100%; max-width:560px;
  max-height:85vh; display:flex; flex-direction:column; overflow:hidden;
}
.modal-header{
  display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--border);
  flex:0 0 auto;
}
.modal-title{font-size:15px; font-weight:700; color:var(--text-strong);}
.modal-close{border:none; background:transparent; color:var(--text-muted); font-size:15px; padding:4px 8px; border-radius:6px;}
.modal-close:hover{background:var(--grey-100);}
.modal-body{padding:20px; overflow-y:auto; min-height:0; flex:1;}
.modal-footer{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; flex:0 0 auto;}
.modal-headline{font-size:15px; font-weight:700; color:var(--text-strong); margin:4px 0 2px;}
.modal-summary-text{font-size:12.5px; color:var(--text-weak); line-height:1.55; background:var(--grey-100); border-radius:var(--r-md); padding:12px; margin-top:8px;}
.modal-section-label{font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin:16px 0 8px;}
.task-history-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
.task-history-row:last-child{border-bottom:none;}
.task-history-row-main{flex:1; min-width:0;}
.task-history-row-title{font-size:12.5px; font-weight:600; color:var(--text-strong);}
.task-history-row-sub{font-size:11px; color:var(--text-muted); margin-top:1px;}

/* ---------- Toasts ---------- */
#toast-container{position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:999;}
.toast{background:var(--text-strong); color:#fff; padding:10px 16px; border-radius:var(--r-md); font-size:12.5px; font-weight:600; box-shadow:var(--shadow-lg); animation:toast-in .18s ease-out;}
@keyframes toast-in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
</style>
</head>
<body>
<div class="app">
  <nav class="sn-rail" id="sn-rail"></nav>
  <aside class="sn-flyout" id="sn-flyout"></aside>
  <div class="view-area">
    <div class="view" id="view-inbox" hidden>
      <aside class="convlist">
        <div class="convlist-top">
          <div class="convlist-title">Inbox</div>
          <div class="search-box">🔍<input type="text" placeholder="Search tickets" id="conv-search"></div>
          <button class="btn-simulate" id="inbox-btn-simulate">＋ Simulate incoming</button>
        </div>
        <div class="conv-tabs" id="conv-tabs"></div>
        <div id="new-banner-slot"></div>
        <div class="conv-scroll" id="conv-scroll"></div>
      </aside>
      <!-- #chatpanel / #infopanel live here while browsing the Inbox, and get moved into
           #view-chat instead when a conversation is opened from Tickets/Reports (see
           attachChatPanelsTo()) — same two DOM nodes, same render functions, either way. -->
    </div>
    <div class="view" id="view-chat" hidden>
      <main class="chatpanel" id="chatpanel"></main>
      <aside class="infopanel" id="infopanel"></aside>
    </div>
    <div class="view" id="view-setup" hidden>

function initialsOf(name){ return name.split(' ').filter(Boolean).slice(-2).map(w=>w[0]).join('').toUpperCase(); }
function colorFor(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0; return AVATAR_COLORS[h%AVATAR_COLORS.length]; }
function avatarHTML(name,size){ size=size||36; return `<div class="avatar" style="width:${size}px;height:${size}px;flex:0 0 ${size}px;background:${colorFor(name)};font-size:${Math.round(size*0.36)}px">${initialsOf(name)}</div>`; }
function nowTime(){ const d=new Date(); return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}); }
function minsAgo(n){ return Date.now()-n*60000; }
function formatDuration(ms){
  const mins = Math.max(0, Math.round(ms/60000));
  if(mins<1) return '<1m';
  if(mins<60) return mins+'m';
  const h = Math.floor(mins/60), m = mins%60;
  return (h+'h '+(m?m+'m':'')).trim();
}
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* Builds the initial activity trail — ticket creation, AI classification, and routing —
   so the Log tab reflects everything the AI + routing pipeline already did, not just
   what the agent does after opening the ticket. */
function buildInitialLog(o){
  const t = o.time || nowTime();
  const log = [
    {t, text:'Ticket created'},
    {t, text:`AI classified as ${o.category} · ${o.severity} severity · ${o.confidence}% confidence`}
  ];
  if(o.assignment.type==='ai'){
    log.push({t, text:'🤖 Auto-resolved by AI — no agent needed'});
  } else {
    log.push({t, text:`Routed to ${o.team || BIZ_TEAM_FOR[o.category]} · assigned to ${o.assignment.name}`});
    if(o.locked && o.locked.by && o.locked.by!=='You'){
      log.push({t, text:`Claimed by ${o.locked.by}`});
    }
  }
  return log;
}

function conv(o){
  return Object.assign({
    unread:0, seen:true, isNew:false, locked:null, taskIds:[],

    createdAt: Date.now(), resolvedAt: null
  }, o, { team: o.team || BIZ_TEAM_FOR[o.category] });
}

}

/* Icon rail + flyout menu panel — mirrors side-navigation.structure.json's real IA.
   Only "Omnichannel" has working pages in this demo (Setup/Inbox/Tickets/Analytic);
   every other category still renders for visual completeness but its items are
   out of scope, same as any other not-yet-built section in this demo. */
const SN_CATEGORIES = [
  {id:'omnichannel', label:'Omnichannel', icon:'inbox'},
  {id:'crm', label:'CRM', icon:'crm'},
  {id:'marketing', label:'Marketing', icon:'marketing'},
  {id:'aiAgent', label:'AI Agent', icon:'chatbot'},
  {id:'flow', label:'Flow', icon:'flow'},
  {id:'mobishop', label:'Mobishop', icon:'mobishop'},
  {id:'docBuilder', label:'Doc Builder', icon:'docBuilder'},
  {id:'billing', label:'Billing', icon:'billings'}
];
/* Tickets already absorbed the engineering Task board (see the Tickets/Tasks tab
   merge), so it sits where the real IA's "Task" menu would be — under CRM, alongside
   the customer-relationship pages, rather than under Omnichannel with Inbox/Analytic. */
const SN_MENUS_BY_CATEGORY = {
  omnichannel: [
    {id:'setup', label:'Setup Guide', icon:'setup', navigable:true},
    {id:'inbox', label:'Inbox', icon:'inbox', navigable:true},
    {id:'reports', label:'Analytic', icon:'reports', navigable:true},
    {id:'integration', label:'Omnichannel integration', icon:'integrations', navigable:false},
    {id:'omniSettings', label:'Omnichannel Settings', icon:'settings', navigable:false}
  ],
  crm: [
    {id:'tickets', label:'Tickets', icon:'tickets', navigable:true},
    {id:'contact', label:'Contact', icon:'contacts', navigable:false},
    {id:'customer', label:'Customer', icon:'contacts', navigable:false},
    {id:'taskAnalytic', label:'Task analytic', icon:'reports', navigable:false},
    {id:'crmSettings', label:'CRM Settings', icon:'settings', navigable:false}
  ]
};

/* Which top-level nav category a given page/view belongs to — drives both which
   category highlights active on the rail and which flyout is showing. */
function categoryForView(v){
  if(v==='tickets') return 'crm';
  if(v==='inbox' || v==='setup' || v==='reports') return 'omnichannel';
  return null;
}

function openTaskCount(){ return tasks.filter(t=>t.status!=='Fixed').length; }
function setupRemainingCount(){ return SETUP_STEPS.filter(s=>s.required && !computeStepDone(s.id)).length; }
function inboxUnreadCount(){ return conversations.filter(c=>c.isNew && !c.seen).length; }
function snMenuBadge(id){
  if(id==='inbox') return inboxUnreadCount();
  if(id==='tickets') return openTaskCount();
  if(id==='setup') return setupRemainingCount();
  return 0;
}

function renderRail(){
  const rail = document.getElementById('sn-rail');
  const catHTML = cat => `<button class="sn-rail-btn ${state.navCategory===cat.id?'is-active':''}" data-cat="${cat.id}" title="${cat.label}">
    <span class="sn-rail-icon-wrap">${ICONS[cat.icon]}</span>
    <span>${cat.label}</span>
  </button>`;
  rail.innerHTML = `
    <div class="sn-rail-logo">${ICONS.snLogo}</div>
    <div class="sn-rail-scroll">${SN_CATEGORIES.map(catHTML).join('')}</div>
    <div class="sn-rail-footer">
      <button class="sn-rail-util" id="sn-search-btn" title="Search">${ICONS.search}</button>
      <button class="sn-rail-util" id="sn-alerts-btn" title="Notifications">
        <span class="sn-badge">22</span>${ICONS.alerts}
      </button>
      <button class="sn-rail-util" id="sn-settings-btn" title="Settings">${ICONS.settings}</button>
      <button class="sn-avatar-btn" id="sn-profile-btn" title="Profile">AF<span class="sn-avatar-dot"></span></button>
    </div>
  `;
  rail.querySelectorAll('[data-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.navCategory = btn.dataset.cat; renderRail(); });
  });
  ['sn-search-btn','sn-alerts-btn','sn-settings-btn','sn-profile-btn'].forEach(id=>{
    document.getElementById(id).addEventListener('click', ()=>toast('This section is not part of the demo scope.'));
  });
  renderFlyout();
}

function renderFlyout(){
  const flyout = document.getElementById('sn-flyout');
  const cat = SN_CATEGORIES.find(c=>c.id===state.navCategory);
  const menus = SN_MENUS_BY_CATEGORY[cat.id];
  if(!menus){
    flyout.innerHTML = `
      <div class="sn-flyout-title">${cat.label}</div>
      <div class="empty-note" style="padding:16px 6px;">This section is not part of the demo scope.</div>
    `;
    return;
  }
  flyout.innerHTML = `
    <div class="sn-flyout-title">${cat.label}</div>
    <ul class="sn-menu-list">
      ${menus.map(m=>{
        const active = m.navigable && (state.view===m.id || (state.view==='chat' && state.chatOrigin===m.id));
        const badge = m.navigable ? snMenuBadge(m.id) : 0;
        return `<li>
          <button class="sn-menu-row ${active?'is-active':''}" data-menu="${m.id}" data-navigable="${m.navigable}">
            ${ICONS[m.icon]}
            <span>${m.label}</span>
            ${badge>0?`<span class="sn-badge-inline">${badge>99?'99+':badge}</span>`:''}
          </button>
        </li>`;
      }).join('')}
    </ul>
  `;
  flyout.querySelectorAll('[data-menu]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.navigable==='true') switchView(btn.dataset.menu);
      else toast('This section is not part of the demo scope.');
    });
  });
}

function switchView(v){
  state.view = v;
  // 'chat' has no menu entry of its own, so it borrows whichever category the page it
  // was opened from belongs to (state.chatOrigin) rather than always defaulting to one.
  const cat = categoryForView(v==='chat' ? state.chatOrigin : v);
  if(cat) state.navCategory = cat;
  document.getElementById('view-inbox').hidden = v!=='inbox';
  document.getElementById('view-chat').hidden = v!=='chat';
  document.getElementById('view-setup').hidden = v!=='setup';
  document.getElementById('view-tickets').hidden = v!=='tickets';
  document.getElementById('view-reports').hidden = v!=='reports';
  renderRail();
  if(v==='inbox') renderInbox();
  if(v==='setup') renderSetupPage();
  if(v==='tickets') renderTicketsPage();
  if(v==='reports') renderReportsPage();
  // 'chat' has no menu entry of its own — it's reached via openConversation() (from Inbox
  // or Tickets), which renders it and remembers state.chatOrigin for the back button.
}

/* Switch into the Tickets view and land directly on a given sub-tab —
   used by "View Tasks board", "View ticket" links, etc. */
function openTicketsTab(tab){
  state.ticketsTab = tab;
  switchView('tickets');
}

function assignmentPillHTML(c){
  if(c.assignment.type==='ai') return `<span class="pill pill-ai">🤖 AI-handled</span>`;
  if(c.assignment.name==='You') return `<span class="pill pill-you">👤 You</span>`;
  return `<span class="pill pill-mate">👤 ${esc(c.assignment.name)}</span>`;
}

/* ---------------- Inbox (conversation list) ---------------- */
const CONV_TABS = [
  {id:'all', label:'All', f:c=>true},
  {id:'ai', label:'🤖 AI-handled', f:c=>c.assignment.type==='ai'},
  {id:'unserved', label:'Unserved', f:c=>c.status==='Unserved'},
  {id:'served', label:'Served', f:c=>c.status==='Served'},
  {id:'resolved', label:'Resolved', f:c=>c.status==='Resolved'}
];

function filteredConvs(){
  const tab = CONV_TABS.find(t=>t.id===state.convTab);
  // The Inbox is one row per customer, not per ticket — a customer with several
  // tickets over time is represented by their latest one here.
  let list = latestTicketsByCustomer(conversations).filter(tab.f);
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(c=>c.name.toLowerCase().includes(q) || c.feature.toLowerCase().includes(q));
  }
  return list;
}

function previewOf(c){
  const last = c.messages[c.messages.length-1];
  if(!last) return '';
  if(last.from==='sys') return esc(last.text);
  if(last.type==='csat-response') return esc(last.text);
  const txt = last.from==='in' ? (last.en ? '🌐 '+last.en : last.text) : last.text;
  return esc(txt.length>46 ? txt.slice(0,46)+'…' : txt);
}

/* Card left-rail color + chips — mirrors the real Mobichat InboxView's stripe/chip
   system (Figma 3347:5259/5370): served=blue, unserved=amber, resolved/bot=green,
   with a stronger shade for Critical tickets standing in for the real app's
   "active conversation" state. */
const DOUBLE_CHECK_SVG = `<svg class="conv-readreceipt" viewBox="0 0 24 24" fill="none"><path d="M1.5 12.5L5.57574 16.5757C5.81005 16.8101 6.18995 16.8101 6.42426 16.5757L9 14M16 7L12 11M7 12L11.5757 16.5757C11.8101 16.8101 12.1899 16.8101 12.4243 16.5757L22 7" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round"/></svg>`;

function convStripeColor(c){
  const active = c.severity==='Critical';
  if(c.status==='Served') return active ? '#1e64dc' : '#60b5fa';
  if(c.status==='Unserved') return active ? '#d97706' : '#fbbf24';
  return active ? '#16a34a' : '#4ade80';
}

function assignmentChipHTML(c){
  if(c.assignment.type==='ai') return `<span class="conv-chip conv-chip-neutral">🤖 AI-handled</span>`;
  if(c.assignment.name==='You') return `<span class="conv-chip conv-chip-brand">👤 You</span>`;
  return `<span class="conv-chip conv-chip-neutral">👤 ${esc(c.assignment.name)}</span>`;
}

function renderConvTabs(){
  const el = document.getElementById('conv-tabs');
  const reps = latestTicketsByCustomer(conversations);
  el.innerHTML = CONV_TABS.map(t=>{
    const count = reps.filter(t.f).length;
    return `<button class="conv-tab ${state.convTab===t.id?'active':''}" data-tab="${t.id}">${t.label} <span style="color:var(--text-muted)">${count}</span></button>`;
  }).join('');
  el.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{ state.convTab=b.dataset.tab; renderConvList(); }));
}

function renderNewBanner(){
  const slot = document.getElementById('new-banner-slot');
  const n = conversations.filter(c=>c.isNew && !c.seen).length;
  if(n<=0){ slot.innerHTML=''; return; }
  slot.innerHTML = `<div class="new-banner" id="new-banner">🔔 ${n} new ticket${n>1?'s':''} <span>Show →</span></div>`;
  document.getElementById('new-banner').addEventListener('click', ()=>{
    state.convTab='all'; state.search=''; document.getElementById('conv-search').value='';
    renderConvTabs(); renderConvList();
    const first = conversations.find(c=>c.isNew && !c.seen);
    if(first) openConversation(first.id);
  });
}

function renderConvList(){
  renderConvTabs();
  renderNewBanner();
  const scroll = document.getElementById('conv-scroll');
  const list = filteredConvs();
  if(list.length===0){ scroll.innerHTML = `<div class="empty-note">No tickets in this view.</div>`; return; }
  scroll.innerHTML = list.map(c=>{
    const previewText = previewOf(c);
    const lastOut = c.messages.length>0 && c.messages[c.messages.length-1].from==='out';
    const selected = state.currentId===c.id;
    return `<div class="conv-row ${c.status==='Served'?'served-bg':''} ${selected?'selected':''}" data-id="${c.id}">
      <span class="conv-stripe" style="width:${selected?8:2}px; background:${convStripeColor(c)};"></span>
      <div class="conv-row-inner">
        ${avatarHTML(c.name)}
        <div class="conv-body">
          <div class="conv-row-top">
            <span class="conv-name">${esc(c.name)}</span>
            <span class="conv-time">${c.time}</span>
          </div>
          <div class="conv-preview-row">
            ${lastOut ? DOUBLE_CHECK_SVG : ''}
            <span class="conv-preview">${previewText}</span>
          </div>
          <div class="conv-bottom-row">
            <span class="conv-phone-chip">${esc(c.phone)}</span>
            <div class="conv-chips">
              ${c.isNew && !c.seen ? '<span class="conv-chip conv-chip-warning">NEW</span>' : ''}
              ${assignmentChipHTML(c)}
              ${c.locked ? `<span class="lock-ico" title="${c.locked.by==='You'?'Locked by you':'Locked by '+c.locked.by}">🔒</span>` : ''}
              ${c.unread>0 ? `<span class="unread-dot">${c.unread}</span>` : ''}
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  scroll.querySelectorAll('[data-id]').forEach(row=>row.addEventListener('click', ()=>openConversation(row.dataset.id)));
}

/* Moves the shared #chatpanel/#infopanel nodes into the given container — used to put
   them inline next to the Inbox list, or back into the standalone #view-chat page when
   a conversation is opened from Tickets/Reports. Same nodes, same render functions. */
function attachChatPanelsTo(containerId){
  const container = document.getElementById(containerId);
  container.appendChild(document.getElementById('chatpanel'));
  container.appendChild(document.getElementById('infopanel'));
}

function renderInbox(){
  renderConvList();
  const search = document.getElementById('conv-search');
  search.value = state.search;
  search.oninput = ()=>{ state.search = search.value; renderConvList(); };
  const simBtn = document.getElementById('inbox-btn-simulate');
  if(simBtn) simBtn.onclick = simulateIncoming;

  // Chat + info render inline beside the list — no separate "chat" view to navigate to.
  attachChatPanelsTo('view-inbox');
  renderChat();
  renderInfoPanel();
}

/* Short, headline-style ticket summary — used on the Tickets table and the ticket modal */
const HEADLINES = {
  Billing: 'Subscription payment not reflected',
  WABABug: 'WhatsApp Business API disconnecting',
  AccountSuspended: 'Account suspended, disputes spam flag',

function getConv(id){ return conversations.find(c=>c.id===id); }
function logActivity(c, text){ c.activityLog.push({t:nowTime(), text}); }

/* All tickets ever raised by this same customer (matched by phone number), oldest
   first. The Inbox uses this to show the customer's whole history in one thread;
   the Tickets page never calls this — each ticket there only ever shows its own
   messages, and an older ticket is only reachable via its own row/ticket code. */
function customerTickets(c){
  return conversations.filter(x=>x.phone===c.phone).sort((a,b)=>a.createdAt-b.createdAt);
}

/* One Inbox row per customer, represented by their most recently created ticket
   (so status/preview reflect what's current) — customerTickets() is what pulls the
   rest of that customer's history back in once the row is opened. */
function latestTicketsByCustomer(list){
  const latest = new Map();
  list.forEach(c=>{
    const cur = latest.get(c.phone);
    if(!cur || c.createdAt > cur.createdAt) latest.set(c.phone, c);
  });
  return [...latest.values()];
}

/* The sole entry point into a conversation — every path (Inbox list, Tickets table,
   ticket modal, task card, new-ticket banner) funnels through here. From the Inbox it
   renders the chat inline next to the list (no navigation, no back button needed —
   just click another row). From everywhere else it opens the standalone chat view and
   remembers the origin page in state.chatOrigin so that view's back button can return there. */
function openConversation(id){
  const c = getConv(id);
  if(!c) return;
  const wasUnseen = !c.seen;
  c.seen = true; c.isNew = false; c.unread = 0;
  if(!c.locked){ c.locked = {by:'You'}; logActivity(c,'Claimed by You'); }
  state.currentId = id;
  state.aiPopupOpen = true;
  if(wasUnseen) logActivity(c,'Ticket opened');

  if(state.view==='inbox'){
    renderConvList();
    renderChat();
    renderInfoPanel();
    return;
  }

  if(state.view!=='chat') state.chatOrigin = state.view;
  attachChatPanelsTo('view-chat');
  switchView('chat');
  renderChat();
  renderInfoPanel();
}

function lockBannerHTML(c){

}

function bubbleHTML(m, c){
  if(m.from==='sys'){
    return `<div class="msg-row sys"><div class="bubble">${esc(m.text)}</div></div>`;
  }
  if(m.type==='csat-response'){
    return `<div class="msg-row in"><div class="bubble csat-stars">${esc(m.text)}</div><div class="msg-meta">${m.time||''}</div></div>`;
  }
  if(m.type==='csat-survey'){
    return `<div class="msg-row out">
      <div class="csat-survey-card">
        <div class="csat-survey-title">📋 How was your experience?</div>
        <div class="csat-survey-sub">We'd love your feedback on the support you just received.</div>
        <div class="csat-survey-stars">☆ ☆ ☆ ☆ ☆</div>
      </div>
      <div class="msg-meta">You · ${m.time||''}</div>
    </div>`;
  }
  if(m.from==='in'){
    return `<div class="msg-row in">
      <div class="bubble">${esc(m.text)}</div>
      ${m.en ? `<div class="msg-translate">🌐 <span>${esc(m.en)}</span></div>` : ''}
      <div class="msg-meta">${m.time||''}</div>
    </div>`;
  }
  const isAI = m.label==='AI';
  return `<div class="msg-row out">
    <div class="bubble ${isAI?'ai':''}">${esc(m.text)}</div>
    ${m.translated && m.en ? `<div class="msg-translate">🌐 Drafted in English: “${esc(m.en)}”</div>` : ''}
    <div class="msg-meta">${isAI?'<span class="msg-label-ai">🤖 AI</span>':esc(m.label||'')} ${m.time||''}</div>
  </div>`;
}

/* From the Inbox, a ticket is opened in the context of its customer — the thread
   shows every ticket that customer has ever raised, oldest first, so an admin can
   see the whole relationship. From everywhere else (Tickets, the ticket modal, task
   cards) a ticket is opened on its own — the thread shows only that one ticket's own
   messages, and an older ticket is only reachable by opening it directly. */
function renderThread(c){
  const thread = document.getElementById('thread');
  const tickets = state.view==='inbox' ? customerTickets(c) : [c];
  if(tickets.length > 1){
    thread.innerHTML = tickets.map(t=>
      `<div class="day-divider">🎫 Ticket ${ticketIdFor(t)} · ${t.category}</div>` + t.messages.map(m=>bubbleHTML(m,t)).join('')
    ).join('');
  } else {
    thread.innerHTML = `<div class="day-divider">Today</div>` + tickets[0].messages.map(m=>bubbleHTML(m,tickets[0])).join('');
  }
  thread.scrollTop = thread.scrollHeight;
}

/* ---------------- composer + AI suggestion popup ---------------- */
function pickSuggestionSet(category){ return SUGGESTIONS[category] || SUGGESTIONS.Positive; }

function confidenceChipHTML(pct){
  const cls = pct>=80 ? 'chip-conf-hi' : 'chip-conf-lo';
  return `<span class="chip ${cls}">🎯 ${pct}% confidence</span>`;
}

function renderComposerArea(c, prefillText){
  const wrap = document.getElementById('composer-wrap');
  if(c.assignment.type==='ai'){
    wrap.innerHTML = c.csat
      ? `<div class="resolved-note">🤖 Auto-resolved by AI — CSAT collected (${c.csat.rating}/5 ⭐)</div>`
      : `<div class="resolved-note">🤖 Auto-resolved by AI — satisfaction survey sent, waiting on the customer…</div>`;
    return;
  }
  if(c.status==='Resolved'){
    wrap.innerHTML = c.csat
      ? `<div class="resolved-note">✅ Ticket resolved — CSAT collected (${c.csat.rating}/5 ⭐)</div>`
      : `<div class="resolved-note">📨 Satisfaction survey sent — waiting on the customer's response…</div>`;
    return;
  }
  const lockedByOther = c.locked && c.locked.by!=='You';
  if(lockedByOther){
    wrap.innerHTML = `<div class="resolved-note">🔒 Locked by ${esc(c.locked.by)} — open a different ticket to help elsewhere.</div>`;
    return;
  }

  const suggSet = pickSuggestionSet(c.category);
  const idx = c._suggIdx % suggSet.length;
  const sugg = suggSet[idx];
  const sendsIn = c.lang;
  const flagged = c.confidence < 80;
  const kbSource = knowledgeSourceFor(c.category);

  // The AI drafts directly in the customer's own language — that's what actually gets sent.
  const sentText = c.lang==='Indonesian' ? (sugg.id || sugg.en) : sugg.en;

  wrap.innerHTML = `
    ${state.aiPopupOpen ? `
    <div class="ai-popup" id="ai-popup">
      <div class="ai-popup-head">
        <div class="ai-popup-title">✨ AI Suggested reply</div>
        <button class="ai-popup-close" id="ai-popup-close">✕</button>
      </div>
      <div class="ai-meta-row">
        ${confidenceChipHTML(c.confidence)}
        <span class="chip chip-lang">🌐 drafted in ${sendsIn}</span>
        ${kbSource ? `<span class="chip chip-kb" title="Drafted using this document from your Knowledge Base">📚 ${esc(kbSource)}</span>` : ''}
        ${flagged ? `<span class="chip chip-flag">⚠️ flagged for human review</span>` : ''}
      </div>
      <div class="ai-suggestion-text">${esc(sentText)}</div>
      <div class="ai-popup-actions">
        <button class="btn btn-primary btn-sm" id="btn-use-reply">Use this reply</button>
        <button class="btn btn-sm" id="btn-show-another">Show another →</button>
        <button class="btn btn-sm btn-quick-send" id="btn-quick-send" title="Send this reply immediately, no review step">⚡ Quick Send</button>
      </div>
    </div>` : ''}
    ${(!state.aiPopupOpen && c.lang!=='English') ? `<div class="hint-row" style="margin:8px 14px 0;">💡 Tip: ${c.lang} customer — try the AI suggestion for an accurate translated reply.</div>` : ''}
    <div class="composer">
      <div class="composer-box">
        <textarea id="composer-text" maxlength="500" placeholder="Type a reply…">${esc(prefillText||'')}</textarea>
        <div class="composer-toolbar">
          <div class="composer-icons"><span>📎</span><span>😊</span><span>🖼️</span></div>
          <span class="char-count" id="char-count">${(prefillText||'').length}/500</span>
        </div>
      </div>
      <div class="composer-actions">
        <button class="btn" id="btn-ai-trigger">⚡ AI · Suggest reply</button>
        <button class="btn btn-primary" id="btn-send">Send</button>
      </div>
    </div>
  `;

  const ta = document.getElementById('composer-text');
  ta.addEventListener('input', ()=>{ document.getElementById('char-count').textContent = `${ta.value.length}/500`; });
  if(prefillText){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }

  const closeBtn = document.getElementById('ai-popup-close');
  if(closeBtn) closeBtn.addEventListener('click', ()=>{ state.aiPopupOpen=false; renderComposerArea(c, ta.value); });

  const useBtn = document.getElementById('btn-use-reply');
  if(useBtn) useBtn.addEventListener('click', ()=>useAISuggestion(c));

  const anotherBtn = document.getElementById('btn-show-another');
  if(anotherBtn) anotherBtn.addEventListener('click', ()=>{ c._suggIdx++; renderComposerArea(c, ta.value); });

  const quickSendBtn = document.getElementById('btn-quick-send');
  if(quickSendBtn) quickSendBtn.addEventListener('click', ()=>quickSendAISuggestion(c));

  document.getElementById('btn-ai-trigger').addEventListener('click', ()=>{ state.aiPopupOpen=true; renderComposerArea(c, ta.value); });
  document.getElementById('btn-send').addEventListener('click', ()=>{
    const text = ta.value.trim();
    if(!text) return;
    c.messages.push({from:'out', text, label:'You', time:nowTime()});
    logActivity(c, 'Agent replied manually');
    if(c.status==='Unserved') c.status='Served';
    renderThread(c);
    renderComposerArea(c);
  });
}

function useAISuggestion(c){
  const suggSet = pickSuggestionSet(c.category);
  const sugg = suggSet[c._suggIdx % suggSet.length];
  const sentText = c.lang==='Indonesian' ? (sugg.id || sugg.en) : sugg.en;
  logActivity(c, 'AI-suggested reply inserted into composer');
  state.aiPopupOpen = false;
  renderComposerArea(c, sentText);
  toast('✨ Reply added to the message box — review and send');
}

function quickSendAISuggestion(c){
  const suggSet = pickSuggestionSet(c.category);
  const sugg = suggSet[c._suggIdx % suggSet.length];
  const langKey = c.lang==='Indonesian' ? 'id' : 'en';
  const sentText = sugg[langKey] || sugg.en;
  const translated = langKey!=='en';
  c.messages.push({from:'out', text:sentText, label:'You', time:nowTime(), translated, en: translated?sugg.en:null});
  logActivity(c, 'AI-suggested reply quick-sent'+(translated?' (auto-translated)':''));
  if(c.status==='Unserved') c.status='Served';
  state.aiPopupOpen = false;
  renderThread(c);
  renderComposerArea(c);
  toast('⚡ Quick sent'+(translated?` in ${c.lang}`:''));
}

function markResolved(id){
  const c = getConv(id);
  if(!c) return;
  c.status = 'Resolved';
  c.resolvedAt = Date.now();
  logActivity(c, 'Marked Resolved');
  if(state.currentId===c.id){ renderChat(); renderInfoPanel(); }
  if(state.view==='tickets') renderTicketsPage();
  if(state.view==='inbox') renderConvList();
  toast('✅ Ticket marked Resolved — satisfaction survey sent');
  sendCSATSurvey(c);
}

/* Not scoped to "the currently open conversation" — markResolved() can now be triggered
   on a ticket that isn't the one on screen (e.g. auto-resolve from a merged customer
   message), so every render here is guarded by state.currentId instead of assumed. */
function sendCSATSurvey(c){
  c.messages.push({from:'out', type:'csat-survey', time:nowTime()});
  logActivity(c, 'Satisfaction survey sent');
  if(state.currentId===c.id){ renderThread(c); renderComposerArea(c); }
  setTimeout(()=>{
    const rating = c.confidence>=85 ? 5 : c.confidence>=75 ? 4 : 4;
    const stars = '⭐'.repeat(rating);
    c.messages.push({from:'in', type:'csat-response', text:stars, time:nowTime()});
    c.csat = {rating, comment:''};
    logActivity(c, `CSAT received ${stars}`);
    if(state.currentId===c.id){ renderThread(c); renderComposerArea(c); }
    if(state.view==='tickets') renderTicketsPage();
    if(state.view==='inbox') renderConvList();
    toast(`⭐ CSAT received: ${rating}/5 from ${c.name}`);
  }, 1300);
}

/* A bot-handled ticket has no human review step, so it's treated as closed the moment
   the AI replies: status flips straight to Resolved and the CSAT survey goes out right
   away, mirroring the human markResolved()/sendCSATSurvey() flow above. Used both for
   brand-new AI tickets (animated, live:true) and to backfill the seeded ones on load
   (instant, no timers/toasts — nothing was actually "just" resolved). */
function resolveAITicket(c, opts){
  const live = !!(opts && opts.live);
  c.status = 'Resolved';
  if(!c.resolvedAt) c.resolvedAt = live ? Date.now() : (c.createdAt + 2*60000);
  const rating = c.confidence>=85 ? 5 : c.confidence>=75 ? 4 : 4;
  const stars = '⭐'.repeat(rating);
  c.messages.push({from:'out', type:'csat-survey', time:c.time||nowTime()});
  logActivity(c, 'Satisfaction survey sent');

  const applyRating = ()=>{
    c.messages.push({from:'in', type:'csat-response', text:stars, time:c.time||nowTime()});
    c.csat = {rating, comment:''};
    logActivity(c, `CSAT received ${stars}`);
  };

  if(!live){ applyRating(); return; }
  if(state.currentId===c.id){ renderThread(c); renderComposerArea(c); }
  setTimeout(()=>{
    applyRating();
    if(state.currentId===c.id){ renderThread(c); renderComposerArea(c); }
    if(state.view==='tickets') renderTicketsPage();
    if(state.view==='inbox') renderConvList();
    toast(`⭐ CSAT received: ${rating}/5 from ${c.name}`);
  }, 1300);
}

function createEngineeringTask(c){
  const key = c.feature+'|'+c.category;
  // Exclude tasks already linked to THIS ticket, so an agent can file more than one
  // distinct task off the same conversation instead of only ever merging into one.
  const existing = tasks.find(t=>t.status!=='Fixed' && (t.feature+'|'+t.category)===key && !c.taskIds.includes(t.id));
  if(existing){
    existing.playersAffected++;
    existing.linkedTicketIds.push(c.id);
    c.taskIds.push(existing.id);
    logActivity(c, `Merged into existing task ${existing.id}`);
    toast(`🔗 Merged into ${existing.id} — now ${existing.playersAffected} customers affected`);
  } else {
    const engTeam = ENG_TEAM_FOR[c.category] || 'Platform Engineering';
    const t = {
      id:'BUG-'+(1020+taskSeq++), title:taskTitleFor(c), feature:c.feature, category:c.category, device:c.device,
      version:c.version, severity:c.severity, confidence:c.confidence, playersAffected:1,
      status: c.severity==='Critical' ? 'Open' : 'Investigating',
      eta: c.severity==='Critical' ? '1 day' : c.severity==='Medium' ? '3 days' : '5 days',
      team: engTeam, engineer: ENGINEER_BY_TEAM[engTeam] || 'Unassigned', linkedTicketIds:[c.id]
    };
    tasks.unshift(t);
    c.taskIds.push(t.id);
    logActivity(c, `Engineering task ${t.id} created · assigned to ${t.engineer}`);
    toast(`🛠 Engineering task ${t.id} created`);
  }
  renderRail();
  renderInfoPanel();
  if(state.view==='tickets') renderTicketsPage();
}

function taskTitleFor(c){
  const map = {
    Billing:'Subscription payment not reflected', WABABug:'WhatsApp Business API disconnecting',
    AccountSuspended:'Account suspension needs manual review', ChatbotBug:'Chatbot keyword trigger broken',
    BroadcastFail:'Broadcast messages failing to send'
  };
  return (map[c.category]||c.category) + ' — ' + c.feature;
}

/* ---------------- simulate incoming ---------------- */
let simCounter = 100;

/* A customer closing the loop with a "thanks, it's fixed" reply is treated as a
   resolution signal on its own — no need to wait for the agent to click Mark Resolved. */
const CLOSING_THANKS_KEYWORDS = [
  'makasih','terima kasih','thank you','thanks','thx',
  'sudah beres','sudah fixed','sudah bisa','udah bisa','udah beres',
  "it's fixed",'already fixed','all fixed','fixed now','working now','works now',
  'resolved now','all good now','solved'
];
function isClosingThanksMessage(text){
  const t = (text||'').toLowerCase();
  return CLOSING_THANKS_KEYWORDS.some(k=>t.includes(k));
}

function simulateIncoming(){
  const tpl = SIM_POOL[state.simIndex % SIM_POOL.length];
  state.simIndex++;

  if(tpl.type==='merge'){
    const c = getConv(tpl.targetId);
    c.messages.push({from:'in', lang:tpl.lang, text:tpl.text, en:tpl.en, time:nowTime()});
    c.time = nowTime();
    c.waited = 0;

    // Bot/agent already replied, and the customer's new message reads like a close-out —
    // auto-resolve and send the CSAT survey instead of just reopening the ticket.
    const hasPriorReply = c.messages.some(m=>m.from==='out' && m.type!=='csat-survey');
    if(hasPriorReply && c.status!=='Resolved' && isClosingThanksMessage(`${tpl.text} ${tpl.en||''}`)){
      logActivity(c, `${c.name} confirmed the issue is fixed`);
      renderRail();
      markResolved(c.id);
      return;
    }

    if(c.status==='Resolved') c.status='Unserved';
    if(state.currentId !== c.id){ c.unread = (c.unread||0)+1; c.seen=false; }
    logActivity(c, 'New message merged into existing thread');
    toast(`↩️ New message from ${c.name} merged into existing ticket — no duplicate created`);
    if(state.currentId===c.id && (state.view==='chat' || state.view==='inbox')) renderChat();
    if(state.view==='tickets') renderTicketsPage();
    if(state.view==='inbox') renderConvList();
    renderRail();
    return;
  }

  simCounter++;
  const id = 'sim'+simCounter;

  if(tpl.type==='ai'){
    const suggSet = pickSuggestionSet(tpl.category);
    const sugg = suggSet[0];
    const replyText = tpl.lang==='Indonesian' ? (sugg.id || sugg.en) : sugg.en;
    const c = conv({
      id, name:tpl.name, phone:randomPhone(), cid:'CID-'+Math.floor(10000+Math.random()*89999),
      status:'Bot', time:nowTime(), lang:tpl.lang, feature:tpl.feature, device:'Chrome on Windows 11', version:'3.4.0',
      spend:'Rp '+(Math.floor(Math.random()*400)+50)+'.000',
      memberSince:'2024', pastTickets:0, waited:0, sentiment:tpl.sentiment, priority:tpl.priority,
      severity:tpl.severity, category:tpl.category, confidence:tpl.confidence, assignment:{type:'ai'},
      csat:null, resolvedAt:Date.now(),
      messages:[
        {from:'in', lang:tpl.lang, text:tpl.text, en:tpl.en, time:nowTime()},
        {from:'out', text:replyText, label:'AI', time:nowTime()}
      ]
    });
    conversations.unshift(c);
    logActivity(c, 'Auto-resolved by AI');
    toast(`🤖 AI auto-resolved a new ticket from ${c.name} — satisfaction survey sent`);
    resolveAITicket(c, {live:true});
  } else {
    const c = conv({
      id, name:tpl.name, phone:randomPhone(), cid:'CID-'+Math.floor(10000+Math.random()*89999),
      status:'Unserved', time:nowTime(), lang:tpl.lang, feature:tpl.feature, device:'Chrome on Windows 11', version:'3.4.0',
      spend:'Rp '+(Math.floor(Math.random()*1500)+100)+'.000',
      memberSince:'2023', pastTickets:Math.floor(Math.random()*3), waited:0, seen:false, isNew:true, unread:1,
      sentiment:tpl.sentiment, priority:tpl.priority, severity:tpl.severity, category:tpl.category,
      confidence:tpl.confidence, assignment:{type:'agent', name: pickRouteAgent(tpl.category)},
      messages:[{from:'in', lang:tpl.lang, text:tpl.text, en:tpl.en, time:nowTime()}]
    });
    conversations.unshift(c);
    toast(`🔔 New ticket from ${c.name}`);
  }
  renderRail();
  if(state.view==='tickets') renderTicketsPage();
  if(state.view==='inbox') renderConvList();
}

function randomPhone(){
  return '+62 8'+Math.floor(10000000+Math.random()*89999999);
}
function pickRouteAgent(category){
  const team = BIZ_TEAM_FOR[category];
  if(team==='Technical') return Math.random()<0.5 ? 'You' : 'Fajar';
  if(team==='Billing') return Math.random()<0.5 ? 'Rani' : 'Dimas';
  if(team==='Trust & Safety') return 'Wulan';
  return 'You';
}

  page.querySelectorAll('[data-toggle-step]').forEach(b=>b.addEventListener('click', ()=>{

    kbDropzone.addEventListener('drop', e=>{
      e.preventDefault();

  const kbAddNoteBtn = page.querySelector('[data-action="kb-add-note"]');
  if(kbAddNoteBtn) kbAddNoteBtn.addEventListener('click', ()=>{
    const titleEl = document.getElementById('kb-note-title');
    const contentEl = document.getElementById('kb-note-content');

    const content = contentEl.value.trim();
    if(!title){ toast('Give your note a title first'); return; }
    SETUP_DATA.knowledge.items.push({ id:'kb'+Date.now()+Math.random().toString(36).slice(2,5), type:'note', name:title, content });

  page.querySelectorAll('[data-action="kb-remove"]').forEach(b=>b.addEventListener('click', ()=>{
    const idx = SETUP_DATA.knowledge.items.findIndex(it=>it.id===b.dataset.id);

  page.querySelectorAll('[data-action="routing-toggle"]').forEach(cb=>cb.addEventListener('change', ()=>{
    const cat = cb.dataset.cat;
    const list = SETUP_DATA.routing.categories;
    const idx = list.indexOf(cat);
    if(cb.checked && idx===-1) list.push(cat);
    if(!cb.checked && idx>-1) list.splice(idx,1);
    renderRail(); renderSetupPage();
  }));

  const aiToggle = page.querySelector('[data-action="ai-toggle"]');
  if(aiToggle) aiToggle.addEventListener('click', ()=>{

  const csatToggle = page.querySelector('[data-action="csat-toggle"]');
