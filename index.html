/* ---------------- Tickets page ---------------- */
const TICKET_FILTERS = [
  {id:'all', label:'All', f:c=>true},
  {id:'mine', label:'🙋 My queue', f:c=>c.assignment.type==='agent' && c.assignment.name==='You'},
  {id:'ai', label:'🤖 AI-handled', f:c=>c.assignment.type==='ai'},
  {id:'unserved', label:'Unserved', f:c=>c.status==='Unserved'},
  {id:'served', label:'Served', f:c=>c.status==='Served'},
  {id:'resolved', label:'✅ Resolved', f:c=>c.status==='Resolved'},
  {id:'Billing', label:'Billing', f:c=>c.team==='Billing'},
  {id:'Technical', label:'Technical', f:c=>c.team==='Technical'},
  {id:'Trust & Safety', label:'Trust & Safety', f:c=>c.team==='Trust & Safety'},
  {id:'Customer Success', label:'Customer Success', f:c=>c.team==='Customer Success'}
];

function computeKPIs(){
  const total = conversations.length;
  const aiHandled = conversations.filter(c=>c.assignment.type==='ai').length;
  const yourQueue = conversations.filter(c=>c.assignment.type==='agent' && c.assignment.name==='You' && c.status!=='Resolved').length;
  const agentsHandle = conversations.filter(c=>c.assignment.type==='agent').length;
  const avgConfidence = Math.round(conversations.reduce((s,c)=>s+c.confidence,0)/total);
  const csatList = conversations.filter(c=>c.csat).map(c=>c.csat.rating);
  const csatPct = csatList.length ? Math.round(csatList.reduce((a,b)=>a+b,0)/csatList.length/5*100) : null;
  return { total, aiHandled, aiHandledPct: Math.round(aiHandled/total*100), yourQueue, agentsHandle, avgConfidence, csatPct };
}

function ticketIdFor(c){ return 'TCK-'+(1030+conversations.indexOf(c)); }

function ticketMatchesSearch(c, q){
  if(!q) return true;
  const hay = [ticketIdFor(c), c.name, c.feature, c.category, c.team, c.assignment.name||'', ticketHeadline(c)]
    .join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

/* Advanced filter panel — narrows the ticket table by Severity/Priority/Assigned on top
   of whatever the quick filter chips + search box already narrowed it to. Each dimension
   is a checkbox set; an empty set means "don't filter on this dimension". */
const FILTER_SEVERITY_OPTS = ['Critical','Medium','Low'];
const FILTER_PRIORITY_OPTS = ['Urgent','High','Normal'];
const FILTER_ASSIGNED_OPTS = [...AGENT_ROSTER.map(a=>a.name), 'AI'];

function assignedKeyFor(c){ return c.assignment.type==='ai' ? 'AI' : c.assignment.name; }

function matchesAdvFilters(c){
  const f = state.ticketAdvFilters;
  if(f.severity.size && !f.severity.has(c.severity)) return false;
  if(f.priority.size && !f.priority.has(c.priority)) return false;
  if(f.assigned.size && !f.assigned.has(assignedKeyFor(c))) return false;
  return true;
}

function activeAdvFilterCount(){
  const f = state.ticketAdvFilters;
  return f.severity.size + f.priority.size + f.assigned.size;
}

function toggleAdvFilter(kind, value){
  const set = state.ticketAdvFilters[kind];
  if(set.has(value)) set.delete(value); else set.add(value);
  renderTicketsPage();
}

function filterCheckHTML(kind, value, label){
  const checked = state.ticketAdvFilters[kind].has(value);
  return `<label class="filter-check">
    <input type="checkbox" data-fkind="${kind}" data-fval="${esc(value)}" ${checked?'checked':''}>
    ${label}
  </label>`;
}

function filterPanelHTML(){

function wireTaskBoardHandlers(page){
  page.querySelectorAll('[data-viewticket]').forEach(b=>b.addEventListener('click', (e)=>{

    openConversation(b.dataset.viewticket);
  }));

  page.querySelectorAll('[data-engineer]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    openEngineerHistoryModal(b.dataset.engineer);
  }));

  page.querySelectorAll('.kanban-task-card').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', card.dataset.taskId);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', ()=>card.classList.remove('dragging'));
  });

  page.querySelectorAll('.kanban-col-body').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', ()=>col.classList.remove('drag-over'));
    col.addEventListener('drop', e=>{
      e.preventDefault();
      col.classList.remove('drag-over');
      const taskId = e.dataTransfer.getData('text/plain');
      const task = tasks.find(t=>t.id===taskId);
      const newStatus = col.dataset.status;
      if(task && task.status !== newStatus){
        task.status = newStatus;
        toast(`${task.id} moved to ${newStatus}`);
        renderRail();
        renderTicketsPage();
      }
    });
  });

function renderReportsPage(){
  document.getElementById('reports-page-header').innerHTML = `
    <div class="page-title">Reports</div>
    <div class="page-sub">A statistical overview of your support performance</div>
  `;
  const page = document.getElementById('reports-page');
  const total = conversations.length;

  const resolved = conversations.filter(c=>c.resolvedAt);
  const durations = resolved.map(c=>c.resolvedAt-c.createdAt);
  const avgMs = durations.length ? durations.reduce((a,b)=>a+b,0)/durations.length : null;
  const fastestMs = durations.length ? Math.min(...durations) : null;
  const slowestMs = durations.length ? Math.max(...durations) : null;
  const aiDurations = resolved.filter(c=>c.assignment.type==='ai').map(c=>c.resolvedAt-c.createdAt);
  const humanDurations = resolved.filter(c=>c.assignment.type==='agent').map(c=>c.resolvedAt-c.createdAt);
  const avgAiMs = aiDurations.length ? aiDurations.reduce((a,b)=>a+b,0)/aiDurations.length : null;
  const avgHumanMs = humanDurations.length ? humanDurations.reduce((a,b)=>a+b,0)/humanDurations.length : null;
  const resolutionRate = total ? Math.round((resolved.length/total)*100) : 0;

  const csatList = conversations.filter(c=>c.csat).map(c=>c.csat.rating);
  const avgCsat = csatList.length ? (csatList.reduce((a,b)=>a+b,0)/csatList.length).toFixed(1) : null;

  const STATUS_ORDER = [
    {id:'Unserved', color:'var(--warning)'}, {id:'Served', color:'var(--blue)'},
    {id:'Resolved', color:'var(--success)'}
  ];
  const statusCounts = STATUS_ORDER.map(s=>({...s, count: conversations.filter(c=>c.status===s.id).length}));
  const statusMax = Math.max(1, ...statusCounts.map(s=>s.count));

  const TEAM_ORDER = ['Billing','Technical','Trust & Safety','Customer Success'];
  const teamCounts = TEAM_ORDER.map(t=>({label:t, count: conversations.filter(c=>c.team===t).length}));
  const teamMax = Math.max(1, ...teamCounts.map(t=>t.count));

  const categoryTally = {};
  conversations.forEach(c=>{ categoryTally[c.category] = (categoryTally[c.category]||0)+1; });
  const categoryCounts = Object.entries(categoryTally).sort((a,b)=>b[1]-a[1]).map(([label,count])=>({label,count}));
  const categoryMax = Math.max(1, ...categoryCounts.map(c=>c.count));

  const csatBuckets = [5,4,3,2,1].map(star=>({
    label:'⭐'.repeat(star)+' '.repeat(0), star,
    count: csatList.filter(r=>r===star).length
  }));
  const csatMax = Math.max(1, ...csatBuckets.map(b=>b.count));

  const rows = [...conversations].sort((a,b)=>b.createdAt-a.createdAt);

  page.innerHTML = `
    <div class="kpi-strip">
      <div class="kpi-card"><div class="kpi-label">Total Tickets</div><div class="kpi-value">${total}</div></div>
      <div class="kpi-card"><div class="kpi-label">Resolution Rate</div><div class="kpi-value blue">${resolutionRate}%</div></div>
      <div class="kpi-card"><div class="kpi-label">Avg Resolution Time</div><div class="kpi-value">${avgMs!==null ? formatDuration(avgMs) : '—'}</div></div>
      <div class="kpi-card"><div class="kpi-label">Fastest / Slowest</div><div class="kpi-value" style="font-size:15px;">${fastestMs!==null?formatDuration(fastestMs):'—'} / ${slowestMs!==null?formatDuration(slowestMs):'—'}</div></div>
      <div class="kpi-card"><div class="kpi-label">Avg CSAT</div><div class="kpi-value">${avgCsat!==null ? `⭐ ${avgCsat}` : '—'}</div></div>
      <div class="kpi-card"><div class="kpi-label">Still Open</div><div class="kpi-value">${total-resolved.length}</div></div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-card-title">Tickets by Status</div>
        <div class="stat-card-sub">Where every ticket currently sits</div>
        ${statusCounts.map(s=>statBarRowHTML(s.id, s.count, statusMax, s.color, total?Math.round(s.count/total*100)+'%':'')).join('')}
      </div>
      <div class="stat-card">
        <div class="stat-card-title">Tickets by Team</div>
        <div class="stat-card-sub">Routing volume across support teams</div>
        ${teamCounts.map(t=>statBarRowHTML(t.label, t.count, teamMax, 'var(--blue)', total?Math.round(t.count/total*100)+'%':'')).join('')}
      </div>
      <div class="stat-card">
        <div class="stat-card-title">Tickets by Category</div>
        <div class="stat-card-sub">Most common reasons customers reach out</div>
        ${categoryCounts.map(c=>statBarRowHTML(c.label, c.count, categoryMax, 'var(--blue-dark)')).join('')}
      </div>
      <div class="stat-card">
        <div class="stat-card-title">CSAT Distribution</div>
        <div class="stat-card-sub">${csatList.length} survey response${csatList.length===1?'':'s'} received</div>
        ${csatList.length
          ? csatBuckets.map(b=>statBarRowHTML(b.star+' star'+(b.star===1?'':'s'), b.count, csatMax, 'var(--warning)')).join('')
          : `<div style="color:var(--text-muted); font-size:12.5px;">No CSAT responses yet.</div>`}
      </div>
    </div>

    <div class="stat-card" style="margin-bottom:18px;">
      <div class="stat-card-title">Resolution Speed — AI vs Human</div>
      <div class="stat-card-sub">Average time to resolve, by who handled it</div>
      <div class="compare-grid">
        <div class="compare-card">
          <div class="compare-card-icon">🤖</div>
          <div class="compare-card-value">${avgAiMs!==null ? formatDuration(avgAiMs) : '—'}</div>
          <div class="compare-card-label">AI-handled · ${aiDurations.length} resolved</div>
        </div>
        <div class="compare-card">
          <div class="compare-card-icon">👤</div>
          <div class="compare-card-value">${avgHumanMs!==null ? formatDuration(avgHumanMs) : '—'}</div>
          <div class="compare-card-label">Human-handled · ${humanDurations.length} resolved</div>
        </div>
      </div>
    </div>

    <div class="reports-toggle-row">
      <button class="link-btn" data-action="toggle-report-table">${state.reportsShowTable ? 'Hide ticket-level detail ▴' : 'Show ticket-level detail ▾'}</button>
    </div>
    ${state.reportsShowTable ? `
    <div style="overflow-x:auto;">
    <table class="ticket-table">
      <thead><tr>
        <th>Ticket</th><th>Customer</th><th>Category</th><th>Status</th><th>Created</th><th>Time Taken</th><th>CSAT</th><th></th>
      </tr></thead>
      <tbody>
        ${rows.map(c=>reportRowHTML(c)).join('')}
      </tbody>
    </table>
    </div>` : ''}
  `;
  page.querySelectorAll('[data-modal]').forEach(b=>b.addEventListener('click', ()=>openTicketModal(b.dataset.modal)));
  const toggleBtn = page.querySelector('[data-action="toggle-report-table"]');
  if(toggleBtn) toggleBtn.addEventListener('click', ()=>{ state.reportsShowTable = !state.reportsShowTable; renderReportsPage(); });
}

function reportRowHTML(c){
  const ticketId = ticketIdFor(c);
  const createdAgo = formatDuration(Date.now()-c.createdAt)+' ago';
  const timeTaken = c.resolvedAt
    ? formatDuration(c.resolvedAt-c.createdAt)
    : `<span style="color:var(--warning);">Ongoing (${formatDuration(Date.now()-c.createdAt)})</span>`;
  return `<tr>
    <td style="font-weight:700;color:var(--blue-dark);">${ticketId}</td>
    <td><div class="tt-customer">${avatarHTML(c.name,26)}<div class="tt-customer-meta">
      <span class="tt-customer-name">${esc(c.name)}</span>
      <span class="tt-customer-sub">${esc(c.feature)} · ${assignmentPillHTML(c)}</span>
    </div></div></td>
    <td>${c.category}</td>
    <td><span class="status-pill status-${c.status}">${c.status}</span></td>
    <td style="color:var(--text-weak);">${createdAgo}</td>
    <td style="font-weight:600;">${timeTaken}</td>
    <td>${c.csat ? `<span class="csat-mini" style="margin-top:0;">⭐ ${c.csat.rating}/5</span>` : '<span style="color:var(--text-muted);">—</span>'}</td>
    <td><button class="link-btn" data-modal="${c.id}">View ticket →</button></td>
  </tr>`;
}

/* ---------------- bootstrap ---------------- */
// Every AI-handled seed ticket is treated as already closed — backfill Resolved status
// + a CSAT rating for any that haven't gone through resolveAITicket() yet.
conversations.forEach(c=>{ if(c.assignment.type==='ai' && c.status!=='Resolved') resolveAITicket(c); });

// Tickets is the landing page — there's no Inbox list to default into, and no
// conversation is pre-opened since the only way in is picking a ticket first.
renderRail();
switchView('tickets');
</script>
</body>
</html>
